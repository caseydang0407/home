<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book club checkout</title>
<style>
  :root { --bg:#eef2f0; --card:#fff; --ink:#15231d; --muted:#5b6b64; --green:#1f5b47; --line:#c9d5cf; --err:#a3281f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101815; --card:#18231f; --ink:#e6efe9; --muted:#9db0a6; --green:#5fb592; --line:#2b3b34; --err:#ff8b80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1 { font:700 1.75rem/1.2 Georgia, serif; margin:0 0 1rem; }
  .tabs { display:flex; border-bottom:2px solid var(--line); margin-bottom:1.25rem; }
  .tabs button { flex:1; padding:.75rem; background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-2px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button[aria-selected="true"] { color:var(--green); border-color:var(--green); }
  label { display:block; margin:.9rem 0 .25rem; font-weight:600; }
  input { width:100%; padding:.7rem; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; }
  button.primary, button.scan { width:100%; margin-top:1rem; padding:.85rem; font:inherit; font-weight:700; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--green); color:#fff; border:0; }
  button.scan { background:var(--card); color:var(--green); border:2px solid var(--green); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  #reader { margin-top:1rem; border-radius:6px; overflow:hidden; }
  #book { margin-top:.75rem; padding:.75rem; background:var(--card); border-left:4px solid var(--green); border-radius:0 6px 6px 0; }
  #msg { margin-top:1rem; font-weight:600; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--green); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Book club checkout</h1>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-borrow" aria-selected="true">Borrow a book</button>
    <button role="tab" id="t-return" aria-selected="false">Return a book</button>
  </div>

  <button class="scan" id="scanBtn">Scan the book's barcode</button>
  <div id="reader" hidden></div>

  <label for="isbn">ISBN (or type it if the scan fails)</label>
  <input id="isbn" inputmode="numeric" autocomplete="off" placeholder="978…">
  <div id="book" hidden></div>

  <div id="borrowFields">
    <label for="name">Your name</label>
    <input id="name" autocomplete="name">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" autocomplete="tel">
  </div>

  <button class="primary" id="submitBtn">Borrow this book</button>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyiSSn4kiMt_Ys4T4iYFaCYULFYdDhakI6vzbYeOtLxwLBW-G4gwnN4ijVB3mBK89lY/exec';   // the /exec URL from Apps Script
let mode = 'borrow', scanner = null;
const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $('t-borrow').setAttribute('aria-selected', m === 'borrow');
  $('t-return').setAttribute('aria-selected', m === 'return');
  $('borrowFields').hidden = m === 'return';
  $('submitBtn').textContent = m === 'borrow' ? 'Borrow this book' : 'Return this book';
  say('');
  if ($('isbn').value) lookup();
}
$('t-borrow').onclick = () => setMode('borrow');
$('t-return').onclick = () => setMode('return');

function say(text, cls) { $('msg').textContent = text; $('msg').className = cls || ''; }

$('scanBtn').onclick = async () => {
  try {
    $('reader').hidden = false;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13] });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 120 } }, async code => {
      await scanner.stop();
      $('reader').hidden = true;
      $('isbn').value = code;
      lookup();
    });
  } catch (e) {
    $('reader').hidden = true;
    say('Camera not available. Allow camera access, or type the ISBN.', 'err');
  }
};

$('isbn').addEventListener('change', lookup);

async function lookup() {
  const isbn = $('isbn').value.replace(/\D/g, '');
  if (isbn.length < 10) return;
  try {
    const r = await (await fetch(API + '?isbn=' + isbn)).json();
    $('book').hidden = false;
    $('book').textContent = r.title + (r.borrowed ? ' (currently checked out)' : ' (available)');
    if (mode === 'borrow' && r.borrowed) say('This book is already checked out.', 'err');
    else if (mode === 'return' && !r.borrowed) say('This book is not checked out.', 'err');
    else say('');
  } catch (e) { say('Could not look up the book. Check your connection.', 'err'); }
}

$('submitBtn').onclick = async () => {
  const payload = { action: mode, isbn: $('isbn').value, name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim() };
  if (!payload.isbn) return say('Scan or enter the ISBN first.', 'err');
  $('submitBtn').disabled = true; say('Saving…');
  try {
    const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) })).json();
    if (r.ok) {
      say(mode === 'borrow' ? 'Borrowed "' + r.title + '". Due ' + r.due + '. A confirmation email is on its way.' : 'Returned "' + r.title + '". Thank you!', 'ok');
      ['isbn', 'name', 'email', 'phone'].forEach(id => $(id).value = ''); $('book').hidden = true;
    } else say(r.error, 'err');
  } catch (e) { say('Could not save. Check your connection and try again.', 'err'); }
  $('submitBtn').disabled = false;
};
</script>
</body>
</html>
