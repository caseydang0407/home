<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book club checkout</title>
<style>
  :root { --bg:#eef2f0; --card:#fff; --ink:#15231d; --muted:#5b6b64; --green:#1f5b47; --line:#c9d5cf; --err:#a3281f; --stamp:#b3372b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101815; --card:#18231f; --ink:#e6efe9; --muted:#9db0a6; --green:#5fb592; --line:#2b3b34; --err:#ff8b80; --stamp:#ff8b80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:34rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h1 { font:700 1.75rem/1.2 Georgia, serif; margin:0 0 1rem; }
  .tabs { display:flex; border-bottom:2px solid var(--line); margin-bottom:1.25rem; }
  .tabs button { flex:1; padding:.75rem .25rem; background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-2px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button[aria-selected="true"] { color:var(--green); border-color:var(--green); }
  label { display:block; margin:.9rem 0 .25rem; font-weight:600; }
  input { width:100%; padding:.7rem; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .btn { width:100%; margin-top:1rem; padding:.85rem; font:inherit; font-weight:700; border-radius:6px; cursor:pointer; background:var(--green); color:#fff; border:2px solid var(--green); }
  .btn.alt { background:var(--card); color:var(--green); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  .link { background:none; border:0; color:var(--green); text-decoration:underline; font:inherit; cursor:pointer; padding:0; }
  #reader { margin-top:1rem; border-radius:6px; overflow:hidden; }
  .book { display:flex; gap:.9rem; margin-top:1rem; padding:.75rem; background:var(--card); border-left:4px solid var(--green); border-radius:0 6px 6px 0; }
  .book img { width:64px; height:96px; object-fit:cover; border-radius:3px; background:var(--line); }
  .book b { font:700 1.1rem/1.3 Georgia, serif; display:block; }
  .muted { color:var(--muted); }
  #msg { margin-top:1rem; font-weight:600; } #msg.err { color:var(--err); } #msg.ok { color:var(--green); }
  .spin { width:28px; height:28px; margin:1rem auto 0; border:4px solid var(--line); border-top-color:var(--green); border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
  .slip { margin-top:1rem; padding:1.25rem; background:var(--card); border:2px dashed var(--line); border-radius:8px; text-align:center; }
  .slip .stamp { display:inline-block; margin-top:.75rem; padding:.35rem .9rem; border:3px solid var(--stamp); color:var(--stamp); font:700 1.35rem Georgia, serif; transform:rotate(-4deg); border-radius:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr)); gap:1rem; }
  .tile { background:var(--card); border-radius:8px; padding:.6rem; border:1px solid var(--line); }
  .tile img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:4px; background:var(--line); }
  .tile b { display:block; font:700 .95rem/1.3 Georgia, serif; margin-top:.4rem; }
  .tile small { display:block; }
  .tile .in { color:var(--green); font-weight:700; } .tile .out { color:var(--stamp); font-weight:700; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="club">Book club checkout</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-borrow" aria-selected="true">Borrow</button>
    <button role="tab" id="t-return" aria-selected="false">Return</button>
    <button role="tab" id="t-shelf" aria-selected="false">Our shelf</button>
  </div>

  <section id="scanView">
    <button class="btn alt" id="scanBtn">Scan the book's barcode</button>
    <div id="reader" hidden></div>
    <label for="isbn">Or type the ISBN</label>
    <input id="isbn" inputmode="numeric" autocomplete="off" placeholder="978…">
    <div class="book" id="book" hidden>
      <img id="cover" alt="">
      <div><b id="bTitle"></b><span class="muted" id="bAuthor"></span><br><span id="bStatus"></span></div>
    </div>
    <div id="borrowFields" hidden>
      <p id="who" class="muted" hidden></p>
      <label for="name">Your name</label><input id="name" autocomplete="name">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
      <label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel">
    </div>
    <button class="btn" id="submitBtn" hidden>Borrow this book</button>
  </section>

  <section id="doneView" hidden>
    <div class="slip">
      <div class="muted" id="dHead"></div>
      <b style="font:700 1.4rem Georgia,serif" id="dTitle"></b>
      <div class="muted" id="dAuthor"></div>
      <div id="dDueWrap"><div class="stamp">Due <span id="dDue"></span></div></div>
    </div>
    <button class="btn" id="againBtn">Borrow or return another</button>
  </section>

  <section id="shelfView" hidden><div class="grid" id="grid"></div></section>

  <div class="spin" id="spin" hidden role="status" aria-label="Loading"></div>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzy2EHFv6BlWayDkoqmdCVMHDCxzaPWYFBxyfyOLRR9VDFACTj8qQfbx5ug59DmD1yS/exec';   // the /exec URL from Apps Script
const CLUB_NAME = 'Captain Cable Book Club';           // your club's name
let mode = 'borrow', scanner = null, current = null;
const $ = id => document.getElementById(id);
const coverUrl = isbn => 'https://covers.openlibrary.org/b/isbn/' + isbn + '-M.jpg?default=false';

$('club').textContent = CLUB_NAME; document.title = CLUB_NAME;

function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .12); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(120);
}
function say(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }
function busy(on) { $('spin').hidden = !on; }
function view(v) { ['scan', 'done', 'shelf'].forEach(x => $(x + 'View').hidden = x !== v); }

function reset() {
  current = null; $('isbn').value = ''; say('');
  ['book', 'borrowFields', 'submitBtn'].forEach(id => $(id).hidden = true);
  view('scan');
}
function setMode(m) {
  mode = m;
  ['borrow', 'return', 'shelf'].forEach(x => $('t-' + x).setAttribute('aria-selected', x === m));
  $('submitBtn').textContent = m === 'borrow' ? 'Borrow this book' : 'Return this book';
  if (m === 'shelf') { say(''); view('shelf'); loadShelf(); } else reset();
}
['borrow', 'return', 'shelf'].forEach(m => $('t-' + m).onclick = () => setMode(m));
$('againBtn').onclick = () => setMode(mode === 'shelf' ? 'borrow' : mode);

// Returning members: details are kept on this phone only
function loadMember() {
  try { const m = JSON.parse(localStorage.getItem('member') || 'null');
    if (m) { $('name').value = m.name; $('email').value = m.email; $('phone').value = m.phone;
      $('who').hidden = false; $('who').textContent = 'Welcome back, ' + m.name + '. ';
      const b = document.createElement('button'); b.className = 'link'; b.textContent = 'Not you?';
      b.onclick = () => { localStorage.removeItem('member'); ['name', 'email', 'phone'].forEach(i => $(i).value = ''); $('who').hidden = true; };
      $('who').appendChild(b); } } catch (e) {}
}

$('scanBtn').onclick = async () => {
  try {
    $('reader').hidden = false;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13] });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 120 } }, async code => {
      await scanner.stop(); $('reader').hidden = true; beep(); $('isbn').value = code; lookup();
    });
  } catch (e) { $('reader').hidden = true; say('Camera not available. Allow camera access, or type the ISBN.', 'err'); }
};
$('isbn').addEventListener('change', lookup);

async function lookup() {
  const isbn = $('isbn').value.replace(/\D/g, '');
  if (isbn.length < 10) return;
  busy(true); say('');
  try {
    const r = await (await fetch(API + '?isbn=' + isbn)).json();
    current = { isbn, borrowed: r.borrowed };
    $('bTitle').textContent = r.title; $('bAuthor').textContent = r.author;
    $('cover').hidden = false; $('cover').onerror = () => $('cover').hidden = true; $('cover').src = coverUrl(isbn);
    $('book').hidden = false;
    const ok = mode === 'borrow' ? !r.borrowed : r.borrowed;
    $('bStatus').textContent = r.borrowed ? 'Currently checked out' : 'Available';
    $('borrowFields').hidden = !(ok && mode === 'borrow'); $('submitBtn').hidden = !ok;
    if (ok && mode === 'borrow') loadMember();
    if (!ok) say(mode === 'borrow' ? 'This book is already checked out.' : 'This book is not checked out.', 'err');
  } catch (e) { say('Lookup failed: ' + e.message, 'err'); }
  busy(false);
}

$('submitBtn').onclick = async () => {
  const p = { action: mode, isbn: current.isbn, name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim() };
  $('submitBtn').disabled = true; busy(true); say('');
  try {
    const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(p) })).json();
    if (r.ok) {
      beep();
      if (mode === 'borrow') localStorage.setItem('member', JSON.stringify({ name: p.name, email: p.email, phone: p.phone }));
      $('dHead').textContent = mode === 'borrow' ? 'You borrowed' : 'Returned. Thank you!';
      $('dTitle').textContent = r.title; $('dAuthor').textContent = r.author || '';
      $('dDueWrap').hidden = mode !== 'borrow'; $('dDue').textContent = r.due || '';
      if (mode === 'borrow') say('A confirmation email is on its way.', 'ok');
      view('done');
    } else say(r.error, 'err');
  } catch (e) { say('Could not save: ' + e.message, 'err'); }
  busy(false); $('submitBtn').disabled = false;
};

async function loadShelf() {
  $('grid').textContent = ''; busy(true);
  try {
    const r = await (await fetch(API + '?action=shelf')).json();
    if (!r.books.length) say('No books on the shelf yet. Borrowed books appear here automatically.');
    r.books.forEach(b => {
      const t = document.createElement('div'); t.className = 'tile';
      const img = document.createElement('img'); img.alt = ''; img.onerror = () => img.style.visibility = 'hidden'; img.src = coverUrl(b.isbn);
      const ti = document.createElement('b'); ti.textContent = b.title;
      const au = document.createElement('small'); au.className = 'muted'; au.textContent = b.author;
      const st = document.createElement('small'); st.className = b.due ? 'out' : 'in'; st.textContent = b.due ? 'Out until ' + b.due : 'Available';
      t.append(img, ti, au, st); $('grid').appendChild(t);
    });
  } catch (e) { say('Could not load the shelf: ' + e.message, 'err'); }
  busy(false);
}
</script>
</body>
</html>
